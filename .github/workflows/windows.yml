name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Farga-Studios/DevelopmentSuite
          ref: 6a885a742c0a3bf26b11fc5167a182eb6ea11f7d
          path: .candidate-suite
          persist-credentials: false
      - name: Build pinned updater candidate
        shell: pwsh
        run: |
          dotnet pack .candidate-suite/src/Suite.Updater/Suite.Updater.csproj -c Release -o .candidate-feed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path ".candidate-feed/FargaStudios.Suite.Updater.0.3.0-rc.2.nupkg")) { throw "Missing candidate package" }
      - name: Restore and audit
        run: dotnet restore MarkdownLab/MarkdownLab.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1903%3BNU1904
      - name: Build
        run: dotnet build MarkdownLab/MarkdownLab.csproj -c Release --no-restore
      - name: Test offline update signing
        shell: pwsh
        run: ./scripts/Test-UpdateSigning.ps1
      - name: Publish portable
        run: dotnet publish MarkdownLab/MarkdownLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item LICENSE,README.md,README.es.md,CHANGELOG.md,docs/MANUAL.es.md,docs/MANUAL.en.md publish/
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path publish/* -DestinationPath dist/MarkdownLab-portable-win-x64.zip
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $iscc installer/MarkdownLab.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare versioned installer and checksums
        shell: pwsh
        run: |
          [xml]$project = Get-Content MarkdownLab/MarkdownLab.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $legacy = 'dist/MarkdownLab-Setup-win-x64.exe'
          $versioned = "dist/MarkdownLab-$version-win-x64-setup.exe"
          Copy-Item $legacy $versioned
          if ((Get-FileHash $legacy).Hash -ne (Get-FileHash $versioned).Hash) { throw 'Installer alias mismatch' }
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name | Set-Content ($_.FullName + '.sha256')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownLab-win-x64
          path: dist/
          if-no-files-found: error
