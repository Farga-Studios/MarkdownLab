name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore MarkdownLab/MarkdownLab.csproj
      - name: Build
        run: dotnet build MarkdownLab/MarkdownLab.csproj --configuration Release --no-restore
      - name: Publish portable self-contained
        run: dotnet publish MarkdownLab/MarkdownLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownLab-win-x64
          path: publish/
          if-no-files-found: error