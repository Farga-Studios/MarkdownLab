name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build
        run: dotnet build MarkdownLab/MarkdownLab.csproj -c Release
      - name: Publish portable
        run: dotnet publish MarkdownLab/MarkdownLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item LICENSE,README.md,docs/MANUAL.es.md publish/
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path publish/* -DestinationPath dist/MarkdownLab-portable-win-x64.zip
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $iscc installer/MarkdownLab.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownLab-win-x64
          path: dist/
          if-no-files-found: error
      - name: Create draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/MarkdownLab-portable-win-x64.zip dist/MarkdownLab-Setup-win-x64.exe --draft --generate-notes

      - name: Publish authorized v1.6.1 stable release
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish MarkdownLab v1.6.1 stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.1 dist/MarkdownLab-portable-win-x64.zip dist/MarkdownLab-Setup-win-x64.exe --target "${{ github.sha }}" --title "MarkdownLab v1.6.1 — Stable" --notes-file docs/RELEASE-v1.6.1.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
